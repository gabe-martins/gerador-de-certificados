name: ${CERTIFICATES_INSTANCE:-pagels-certificados}

services:
  certificados:
    image: gerador-certificados:${CERTIFICATES_IMAGE_TAG:-${PAGELS_IMAGE_TAG:-1.2.0}}
    build:
      context: .
    restart: unless-stopped
    init: true
    user: "${CERTIFICATES_UID:-${PAGELS_UID:-10001}}:${CERTIFICATES_GID:-${PAGELS_GID:-10001}}"
    environment:
      CERTIFICATES_DATA_DIR: /data
      CERTIFICATES_PROFILE: ${CERTIFICATES_PROFILE:-pagels-jiu-jitsu}
    ports:
      - "${CERTIFICATES_BIND_IP:-${PAGELS_BIND_IP:-127.0.0.1}}:${CERTIFICATES_PORT:-${PAGELS_PORT:-8090}}:8090"
    volumes:
      - ${CERTIFICATES_DATA_PATH:-./data}:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
